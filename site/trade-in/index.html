<!doctype html>
<html lang="th"><head><link rel="icon" type="image/svg+xml" href="assets/images/clicko-favicon.svg">
	<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../">
	<meta name="theme-color" content="#171717"><title>รับซื้อ / เทิร์นอุปกรณ์ — Clicko</title>
	<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/storefront.css"><link rel="stylesheet" href="assets/css/selection.css"><link rel="stylesheet" href="assets/css/site.css">
</head><body><div data-clicko-header></div>
<main id="main-content" class="clicko-page-content clicko-shell"><section class="clicko-trade-in" aria-labelledby="clicko-trade-title">
	<div><p class="clicko-eyebrow">BUYBACK / TRADE-IN</p><h1 id="clicko-trade-title">รับซื้อ / เทิร์นอุปกรณ์</h1><p>กรอกรุ่น สภาพ และแนบรูปสินค้า ระบบจะบันทึกคำขอไว้ในระบบส่วนตัวของร้านเพื่อให้ Kew ตรวจสอบ</p><p class="clicko-muted">การส่งข้อมูลยังไม่ถือเป็นการเสนอราคา ร้านจะติดต่อกลับเพื่อสอบถามรายละเอียดและประเมินราคา</p></div>
	<form data-clicko-trade-form enctype="multipart/form-data">
		<label class="clicko-trade-in__honeypot" aria-hidden="true">เว็บไซต์<input name="company_website" type="text" tabindex="-1" autocomplete="off"></label>
		<label>รุ่น / ชื่อสินค้า<input name="model" maxlength="160" required placeholder="เช่น การ์ดจอ RTX 4070"></label>
		<label>ประกันสินค้า<input name="warranty" maxlength="100" placeholder="เช่น เหลือประกันถึง 12/2027"></label>
		<label class="clicko-trade-in__wide">สภาพ / ตำหนิ<textarea name="condition" maxlength="500" required placeholder="บอกสภาพการใช้งาน ตำหนิ และอุปกรณ์ที่มี"></textarea></label>
		<label class="clicko-trade-in__wide">รูปสินค้าจริง<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple required><small>แนบอย่างน้อย 1 รูป สูงสุด 4 รูป JPG, PNG หรือ WEBP ไม่เกิน 5 MB ต่อรูป</small></label>
		<div class="clicko-trade-in__captcha clicko-trade-in__wide" data-clicko-turnstile></div>
		<button class="clicko-button" type="submit">ส่งข้อมูลและรูปให้ร้าน <span aria-hidden="true">↗</span></button>
		<p class="clicko-trade-in__status" data-clicko-trade-status role="status" aria-live="polite">ข้อมูลและรูปจะถูกจัดเก็บแบบส่วนตัวเพื่อให้ร้านตรวจสอบ</p>
	</form>
</section></main>
<div data-clicko-footer></div><div class="clicko-toast" data-clicko-toast role="status" aria-live="polite"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="assets/js/site-config.js"></script><script src="assets/js/site-layout.js"></script><script src="assets/js/selection.js"></script>
</body></html>
