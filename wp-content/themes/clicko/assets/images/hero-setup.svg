    <linearGradient id="screen" x1="302" y1="167" x2="635" y2="403" gradientUnits="userSpaceOnUse"><stop stop-color="#071B3A"/><stop offset=".55" stop-color="#0B4D9C"/><stop offset="1" stop-color="#31B4FF"/></linearGradient>
    <linearGradient id="case" x1="711" y1="77" x2="941" y2="525" gradientUnits="userSpaceOnUse"><stop stop-color="#17263B"/><stop offset=".5" stop-color="#060B14"/><stop offset="1" stop-color="#293B54"/></linearGradient>
    <linearGradient id="edge" x1="70" y1="0" x2="550" y2="619" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".96"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
